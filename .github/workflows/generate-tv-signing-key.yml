name: Generate LichAI TV Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate signing secrets
        env:
          STORE_PASS: ${{ secrets.LICHAI_TV_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.LICHAI_TV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LICHAI_TV_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASS" || { echo "Missing LICHAI_TV_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing LICHAI_TV_KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing LICHAI_TV_KEY_ALIAS"; exit 1; }

      - name: Generate release keystore
        env:
          STORE_PASS: ${{ secrets.LICHAI_TV_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.LICHAI_TV_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LICHAI_TV_KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/lichai-tv-release.jks" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=LichAI TV, OU=LichAI, O=LichAI, L=Hanoi, ST=Hanoi, C=VN"
          keytool -list -keystore "$RUNNER_TEMP/lichai-tv-release.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Create Base64 secret file
        run: |
          base64 -w 0 "$RUNNER_TEMP/lichai-tv-release.jks" > "$RUNNER_TEMP/LICHAI_TV_KEYSTORE_BASE64.txt"

      - name: Upload signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: LichAI-TV-SIGNING-KEY-BACKUP
          path: |
            ${{ runner.temp }}/lichai-tv-release.jks
            ${{ runner.temp }}/LICHAI_TV_KEYSTORE_BASE64.txt
          retention-days: 1
          if-no-files-found: error
