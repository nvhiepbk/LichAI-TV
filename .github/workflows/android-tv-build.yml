name: LichAI TV Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore TV release signing key
        env:
          LICHAI_TV_KEYSTORE_BASE64: ${{ secrets.LICHAI_TV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LICHAI_TV_KEYSTORE_BASE64" ]; then
            echo "Missing GitHub secret LICHAI_TV_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$LICHAI_TV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lichai-tv-release.jks"

      - name: Build signed Release APK and AAB
        env:
          LICHAI_TV_KEYSTORE_PATH: ${{ runner.temp }}/lichai-tv-release.jks
          LICHAI_TV_KEYSTORE_PASSWORD: ${{ secrets.LICHAI_TV_KEYSTORE_PASSWORD }}
          LICHAI_TV_KEY_ALIAS: ${{ secrets.LICHAI_TV_KEY_ALIAS }}
          LICHAI_TV_KEY_PASSWORD: ${{ secrets.LICHAI_TV_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LichAI-TV-01-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: LichAI-TV-01-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
